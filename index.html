<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reloj de arena · BeCreatrix</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 28%,#263047 0%,#111725 45%,#080d17 100%);color:#f5f2ed;display:grid;place-items:center;padding:20px}.app{width:min(100%,720px);text-align:center}.eyebrow{font-size:11px;letter-spacing:.32em;color:#c4a778;text-transform:uppercase;margin-bottom:12px}h1{font-family:Georgia,serif;font-weight:400;letter-spacing:-.04em;font-size:clamp(32px,6vw,52px);margin:0}p{font-size:14px;color:#9da9bb;margin:12px 0 4px}.scene{position:relative;margin:8px auto 10px;height:min(56vh,490px);min-height:300px;display:grid;place-items:center}.scene:before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:#d8a65b;filter:blur(100px);opacity:.13}.glass{height:100%;max-height:455px;width:auto;overflow:visible;filter:drop-shadow(0 20px 20px #0008);transform-origin:160px 235px}.glass.turn{transition:transform 1.3s cubic-bezier(.65,.05,.35,1);transform:rotate(180deg)}.sand{fill:#eac17d}.stream{stroke:#eac17d;stroke-width:3;stroke-linecap:round}.controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}.btn{appearance:none;border:1px solid #ffffff25;border-radius:100px;background:#ffffff0a;color:#f5f2ed;padding:13px 22px;font-size:14px;cursor:pointer;transition:.2s}.btn:hover{background:#ffffff1d}.btn.primary{background:#dcb47b;border-color:#dcb47b;color:#151824;font-weight:700}.btn:disabled{opacity:.45;cursor:not-allowed}.setup{display:flex;justify-content:center;align-items:center;gap:9px;margin:20px auto 0;flex-wrap:wrap}.setup input,.setup select{border:1px solid #ffffff26;background:#182235;color:#fff;padding:12px 14px;border-radius:12px;font-size:15px}.setup input{width:100px;text-align:center}.setup label{color:#aeb8c8;font-size:13px}.status{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#cdb28d;min-height:20px;margin:6px 0}.hint{font-size:12px;color:#788599;margin-top:16px}@media(max-width:480px){.scene{height:49vh;min-height:270px}.glass{max-height:390px}.btn{padding:12px 17px}}
</style></head><body><main class="app"><div class="eyebrow">El tiempo en movimiento</div><h1>Reloj de arena</h1><p>Una pausa para crear, pensar y comenzar de nuevo.</p><div class="scene"><svg class="glass" id="glass" viewBox="0 0 320 470" aria-label="Reloj de arena animado" role="img"><defs><linearGradient id="glassfill" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a7d8e5" stop-opacity=".17"/><stop offset=".45" stop-color="#fff" stop-opacity=".025"/><stop offset="1" stop-color="#b4e4f6" stop-opacity=".21"/></linearGradient><linearGradient id="wood" x1="0" x2="1"><stop stop-color="#805a36"/><stop offset=".18" stop-color="#d6a86c"/><stop offset=".5" stop-color="#f2d39a"/><stop offset=".82" stop-color="#bc8950"/><stop offset="1" stop-color="#6c4a2c"/></linearGradient><clipPath id="topclip"><path d="M83 63 Q83 129 133 198 Q146 218 154 235 L166 235 Q174 218 187 198 Q237 129 237 63Z"/></clipPath><clipPath id="bottomclip"><path d="M154 235 Q146 252 133 272 Q83 341 83 407 L237 407 Q237 341 187 272 Q174 252 166 235Z"/></clipPath></defs><ellipse cx="160" cy="448" rx="112" ry="10" fill="#000" opacity=".2"/><path d="M83 63 Q83 129 133 198 Q146 218 154 235 Q146 252 133 272 Q83 341 83 407 L237 407 Q237 341 187 272 Q174 252 166 235 Q174 218 187 198 Q237 129 237 63Z" fill="url(#glassfill)" stroke="#d8e7ec" stroke-opacity=".65" stroke-width="3"/><g clip-path="url(#topclip)"><rect id="topSand" class="sand" x="75" y="63" width="170" height="172"/><path id="topSurface" d="M75 63H245" stroke="#f8d99d" stroke-width="3"/></g><g clip-path="url(#bottomclip)"><rect id="bottomSand" class="sand" x="75" y="407" width="170" height="0"/><path id="bottomSurface" d="M75 407H245" stroke="#f8d99d" stroke-width="3"/></g><path id="stream" class="stream" d="M160 233V404"/><path d="M105 80 Q101 143 142 201" stroke="white" stroke-width="5" opacity=".12" fill="none" stroke-linecap="round"/><path d="M215 78 Q215 141 180 195" stroke="white" stroke-width="2" opacity=".22" fill="none" stroke-linecap="round"/><rect x="57" y="41" width="206" height="23" rx="9" fill="url(#wood)"/><rect x="57" y="405" width="206" height="23" rx="9" fill="url(#wood)"/><rect x="67" y="31" width="186" height="14" rx="6" fill="#e8c58d"/><rect x="67" y="425" width="186" height="14" rx="6" fill="#e8c58d"/><path d="M70 56V414 M250 56V414" stroke="#bc8a54" stroke-width="7" stroke-linecap="round" opacity=".75"/><path d="M70 56V414 M250 56V414" stroke="#f2d39b" stroke-width="2" opacity=".55"/></svg></div><div class="status" id="status" aria-live="polite">Listo para comenzar</div><div class="controls"><button class="btn primary" id="start">Iniciar</button><button class="btn" id="pause">Pausar</button><button class="btn" id="reset">Reiniciar</button></div><div class="setup" id="setup"><label for="duration">Duración</label><input id="duration" type="number" min="1" max="9999" value="30" aria-label="Duración"><select id="unit" aria-label="Unidad de tiempo"><option value="1000">Segundos</option><option value="60000">Minutos</option></select></div><div class="hint">La duración solo se configura aquí; no aparece durante la animación.</div></main><script>
const $=id=>document.getElementById(id),glass=$('glass'),topSand=$('topSand'),bottomSand=$('bottomSand'),stream=$('stream'),topSurface=$('topSurface'),bottomSurface=$('bottomSurface'),status=$('status');let duration=30000,elapsed=0,last=0,playing=false,turning=false,frame=0,turnTimer=null,alarmPlayed=false,audioCtx=null;
function alarm(final=false){
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const now=audioCtx.currentTime;
  if(final){
   // Melodía original estilo arcade Game Over, descendente.
   const notes=[{f:784,t:0,d:.17},{f:659.25,t:.20,d:.17},{f:523.25,t:.40,d:.20},{f:392,t:.64,d:.23},{f:293.66,t:.91,d:.25},{f:196,t:1.20,d:.58}];
   notes.forEach(({f,t,d})=>{
    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),at=now+t;
    osc.type='square';osc.frequency.setValueAtTime(f,at);
    gain.gain.setValueAtTime(.0001,at);
    gain.gain.linearRampToValueAtTime(.17,at+.018);
    gain.gain.setValueAtTime(.17,at+Math.max(.02,d-.08));
    gain.gain.exponentialRampToValueAtTime(.0001,at+d);
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start(at);osc.stop(at+d+.01);
   });
  }else{
   for(let i=0;i<4;i++){
    const at=now+i*.38,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.type='square';osc.frequency.setValueAtTime(850,at);
    gain.gain.setValueAtTime(.0001,at);
    gain.gain.linearRampToValueAtTime(.19,at+.018);
    gain.gain.setValueAtTime(.19,at+.17);
    gain.gain.exponentialRampToValueAtTime(.0001,at+.23);
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start(at);osc.stop(at+.24);
   }
  }
 }catch(e){console.warn('Audio no disponible')}
}
function draw(p){p=Math.max(0,Math.min(1,p)); // El nivel superior desciende y el inferior asciende, siempre en coordenadas físicas.
const topY=63+172*p,bottomY=407-172*p;topSand.setAttribute('y',topY);topSand.setAttribute('height',Math.max(0,235-topY));bottomSand.setAttribute('y',bottomY);bottomSand.setAttribute('height',Math.max(0,407-bottomY));topSurface.setAttribute('d',`M75 ${topY}H245`);bottomSurface.setAttribute('d',`M75 ${bottomY}H245`);stream.style.opacity=(playing&&!turning&&p<.995)?'1':'0';stream.setAttribute('d',`M160 235V${Math.max(236,bottomY)}`)}
function tick(t){if(!playing||turning)return;if(!last)last=t;elapsed+=Math.min(t-last,100);last=t;let p=Math.min(1,elapsed/duration);draw(p);if(!alarmPlayed&&duration-elapsed<=10000){alarmPlayed=true;alarm()}if(p>=1){alarm(true);flip();return}frame=requestAnimationFrame(tick)}
function flip(){playing=false;turning=true;draw(1);status.textContent='Girando…';glass.classList.add('turn');turnTimer=setTimeout(()=>{glass.style.transition='none';glass.classList.remove('turn');glass.style.transform='rotate(0deg)';void glass.getBoundingClientRect();glass.style.transition='';glass.style.transform='';elapsed=0;last=0;alarmPlayed=false;turning=false;playing=true;status.textContent='Arena en movimiento';draw(0);frame=requestAnimationFrame(tick)},1350)}
function begin(){if(turning)return;if(!playing){if(elapsed===0){const n=Number($('duration').value);if(!Number.isFinite(n)||n<=0){status.textContent='Introduce una duración válida';return}duration=n*Number($('unit').value)}playing=true;last=0;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}status.textContent='Arena en movimiento';$('setup').style.display='none';frame=requestAnimationFrame(tick)}}
function pause(){if(turning)return;playing=false;cancelAnimationFrame(frame);last=0;status.textContent='En pausa';draw(elapsed/duration)}
function reset(){clearTimeout(turnTimer);cancelAnimationFrame(frame);playing=false;turning=false;elapsed=0;last=0;alarmPlayed=false;glass.style.transition='none';glass.classList.remove('turn');glass.style.transform='';void glass.getBoundingClientRect();glass.style.transition='';$('setup').style.display='flex';status.textContent='Listo para comenzar';draw(0)}
$('start').onclick=begin;$('pause').onclick=pause;$('reset').onclick=reset;draw(0);
</script></body></html>
